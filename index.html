<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OC Social — Iniciar sesión</title>
  <!-- Solo usamos style.css, que ya incluye los estilos del login -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-pagina="login">

  <div class="login-wrapper">
    <!-- Columna izquierda: logo/ilustración -->
    <div class="login-ilustracion" aria-hidden="true">
      <div class="logo-grande">
        <svg viewBox="0 0 80 80" width="80" height="80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="28" cy="22" r="14" fill="var(--azul)"/>
          <circle cx="52" cy="22" r="14" fill="var(--azul-claro)"/>
          <ellipse cx="28" cy="58" rx="22" ry="14" fill="var(--azul)"/>
          <ellipse cx="52" cy="58" rx="22" ry="14" fill="var(--azul-claro)" opacity="0.7"/>
        </svg>
      </div>
      <h1 class="login-titulo-grande">OC Social</h1>
      <p class="login-subtitulo">La red social para tus personajes originales</p>
    </div>

    <!-- Columna derecha: formulario -->
    <div class="login-formulario-wrapper">
      <div class="login-card">
        <h2 class="login-bienvenida">Bienvenido de vuelta</h2>
        <p class="login-subtexto">Inicia sesión para continuar</p>

        <div id="login-error" class="login-error" role="alert" aria-live="polite"></div>

        <div id="form-login" class="form-login">
          <div class="campo-grupo">
            <label for="input-nombre" class="campo-label">Nombre de usuario</label>
            <input
              type="text"
              id="input-nombre"
              class="campo-input"
              placeholder="Tu nombre de usuario"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              maxlength="50"
            />
          </div>

          <div class="campo-grupo">
            <label for="input-pass" class="campo-label">Contraseña</label>
            <div class="input-pass-wrapper">
              <input
                type="password"
                id="input-pass"
                class="campo-input"
                placeholder="Tu contraseña"
                autocomplete="current-password"
                maxlength="100"
              />
              <button
                type="button"
                class="btn-toggle-pass"
                onclick="togglePass()"
                aria-label="Mostrar/ocultar contraseña"
              >
                <svg id="ico-ojo" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <button
            type="button"
            id="btn-login"
            class="btn-primario btn-login"
            onclick="submitLogin()"
          >
            Iniciar sesión
          </button>
        </div>

        <p class="login-nota">
          ¿No tienes cuenta? Pídele al administrador que te cree una.
        </p>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Handlers específicos del login
    function submitLogin() {
      const nombre = document.getElementById("input-nombre").value.trim();
      const contraseña = document.getElementById("input-pass").value.trim();
      const btnLogin = document.getElementById("btn-login");
      const errorDiv = document.getElementById("login-error");

      if (!nombre || !contraseña) {
        errorDiv.textContent = "Por favor completa todos los campos.";
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = "Iniciando sesión…";
      errorDiv.textContent = "";

      API.post("/auth/login", { nombre, contraseña })
        .then(data => {
          localStorage.setItem("oc_token", data.token);
          localStorage.setItem("oc_usuario", data.nombre);
          localStorage.setItem("oc_rol", data.rol);
          window.location.href = "/html/lobby.html";
        })
        .catch(err => {
          errorDiv.textContent = err.mensaje || "Error al iniciar sesión.";
          btnLogin.disabled = false;
          btnLogin.textContent = "Iniciar sesión";
        });
    }

    function togglePass() {
      const input = document.getElementById("input-pass");
      input.type = input.type === "password" ? "text" : "password";
    }

    // Enter para login
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") submitLogin();
    });

    // Si ya hay sesión, verificar y redirigir
    if (localStorage.getItem("oc_token")) {
      API.get("/auth/verify")
        .then(() => { window.location.href = "/html/lobby.html"; })
        .catch(() => { localStorage.clear(); });
    }
  </script>
</body>
</html>
